# Renders the App Store and Google Play images (TR, EN, DE) from
# test_screenshots/ with sample data: six 6.9" iPhone screenshots
# (1320×2868), the product page header (3840×1646) and the search results
# image (3840×2560) for the App Store; the same six screenshots widened to
# 1434×2868 plus a 1024×500 feature graphic for Google Play, under each
# language's play/ subfolder. Run it from the Actions tab and download the
# "store-screenshots" artifact. macOS for its emoji font.
# App Store Connect and Google Play both reject images with an alpha
# channel; flatten_pngs.py strips it from every PNG under test_screenshots/out.
name: Mağaza ekran görüntüleri

on:
  workflow_dispatch:

jobs:
  screenshots:
    name: Ekran görüntülerini üret
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test test_screenshots --update-goldens
      # App Store Connect rejects images with an alpha channel.
      - run: pip3 install --break-system-packages pillow && python3 tool/flatten_pngs.py test_screenshots/out
      - uses: actions/upload-artifact@v4
        with:
          name: store-screenshots
          path: test_screenshots/out/
