# Renders the App Store screenshots (TR, EN, DE; 6.9" iPhone, 1320×2868)
# from test_screenshots/ with sample data. Run it from the Actions tab and
# download the "store-screenshots" artifact. macOS for its emoji font.
name: Mağaza ekran görüntüleri

on:
  workflow_dispatch:

jobs:
  screenshots:
    name: Ekran görüntülerini üret
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test test_screenshots --update-goldens
      - uses: actions/upload-artifact@v4
        with:
          name: store-screenshots
          path: test_screenshots/out/
